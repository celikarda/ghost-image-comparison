<style>
  .image-comparison { margin: 2em 0; }
  .image-comparison .image-comparison__images > img {
    display: block;
    width: 100%;
    max-width: none;
    height: auto;
    margin: 0;
    border-radius: 0;
  }
  .image-comparison figcaption { margin-top: .75em; text-align: center; font-size: .85em; }
  .image-comparison__images.is-interactive {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    cursor: ew-resize;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
    --comparison-position: 50%;
  }
  .image-comparison .is-interactive > img { -webkit-user-drag: none; }
  .image-comparison .is-interactive > .image-comparison__after {
    position: absolute;
    inset: 0;
    height: 100%;
    object-fit: cover;
  }
  .image-comparison .is-interactive > .image-comparison__before {
    position: relative;
    z-index: 1;
    clip-path: inset(0 calc(100% - var(--comparison-position)) 0 0);
  }
  .image-comparison__label {
    position: absolute;
    top: 12px;
    z-index: 2;
    padding: 4px 10px;
    border-radius: 4px;
    background: #000b;
    color: #fff;
    font: 600 14px/1.5 system-ui, sans-serif;
    pointer-events: none;
  }
  .image-comparison__label--before { left: 12px; }
  .image-comparison__label--after { right: 12px; }
  .image-comparison__divider {
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--comparison-position);
    z-index: 2;
    width: 2px;
    background: #fff;
    transform: translateX(-50%);
    box-shadow: 0 0 3px #0008;
    pointer-events: none;
  }
  .image-comparison__divider::after {
    content: "\2194";
    position: absolute;
    top: 50%;
    left: 50%;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border: 2px solid #fff;
    border-radius: 50%;
    background: #111b;
    color: #fff;
    font: 24px/1 system-ui, sans-serif;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
  }
  .image-comparison .image-comparison__range {
    position: absolute;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    pointer-events: none;
    direction: ltr;
  }
  .image-comparison__images:has(.image-comparison__range:focus-visible) {
    outline: 3px solid #146ef5;
    outline-offset: 4px;
  }
</style>
<script>
  (() => {
    const setup = (card) => {
      const images = card.querySelector('.image-comparison__images');
      if (!images || images.classList.contains('is-interactive')) return;
      const beforeLabel = card.dataset.beforeLabel || 'Before';
      const afterLabel = card.dataset.afterLabel || 'After';
      const caption = card.querySelector('figcaption');
      const range = document.createElement('input');
      range.type = 'range';
      range.min = '0';
      range.max = '100';
      range.value = '50';
      range.className = 'image-comparison__range';
      range.setAttribute('aria-label', card.dataset.label || (caption && caption.textContent.trim()) || 'Image comparison');
      const update = () => {
        images.style.setProperty('--comparison-position', `${range.value}%`);
        range.setAttribute('aria-valuetext', `${beforeLabel} ${range.value}%, ${afterLabel} ${100 - Number(range.value)}%`);
      };
      range.addEventListener('input', update);
      const move = (event) => {
        const bounds = images.getBoundingClientRect();
        range.value = String(Math.round(Math.max(0, Math.min(100, (event.clientX - bounds.left) / bounds.width * 100))));
        update();
      };
      // Mouse drags immediately. Touch and pen only drag after a sideways
      // movement, so vertical swipes scroll the page without moving the divider.
      let drag = null;
      const start = () => {
        drag.active = true;
        range.focus({preventScroll: true});
      };
      images.addEventListener('pointerdown', (event) => {
        if (!event.isPrimary || event.button !== 0) return;
        drag = {id: event.pointerId, x: event.clientX, y: event.clientY, active: false};
        images.setPointerCapture(event.pointerId);
        if (event.pointerType === 'mouse') {
          event.preventDefault();
          start();
          move(event);
        }
      });
      images.addEventListener('pointermove', (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        if (!drag.active) {
          const dx = Math.abs(event.clientX - drag.x);
          if (dx < 6 || dx <= Math.abs(event.clientY - drag.y)) return;
          start();
        }
        move(event);
      });
      images.addEventListener('pointerup', (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        if (!drag.active) {
          start();
          move(event);
        }
        drag = null;
      });
      images.addEventListener('pointercancel', () => { drag = null; });
      images.addEventListener('dragstart', (event) => event.preventDefault());
      const divider = document.createElement('span');
      divider.className = 'image-comparison__divider';
      divider.setAttribute('aria-hidden', 'true');
      images.append(divider);
      [['before', beforeLabel], ['after', afterLabel]].forEach(([side, text]) => {
        const label = document.createElement('span');
        label.className = `image-comparison__label image-comparison__label--${side}`;
        label.textContent = text;
        label.setAttribute('aria-hidden', 'true');
        images.append(label);
      });
      images.append(range);
      images.classList.add('is-interactive');
      update();
    };
    const setupAll = () => document.querySelectorAll('.image-comparison').forEach(setup);
    setupAll();
    // Themes that load more posts without a page reload add cards later.
    let queued = false;
    new MutationObserver(() => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        setupAll();
      });
    }).observe(document.body, {childList: true, subtree: true});
  })();
</script>
